[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinlp"
version = "0.1.0"
description = "Vietnamese clinical NLP pipeline for the Viettel competition"
requires-python = ">=3.10"
dependencies = [
    "regex>=2024.4.16",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Installed only on the GPU/Linux training-serving host (see README) — not required
# to run the rule-based baseline or the eval harness.
llm = [
    "torch>=2.3",
    "transformers>=4.42",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "vllm>=0.5",
    "outlines>=0.0.46",
    "sentence-transformers>=3.0",
    "rank_bm25>=0.2.2",
    "faiss-cpu>=1.8",
]
dev = [
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinlp*"]
